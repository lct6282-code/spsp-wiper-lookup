<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SPSP 雨刷查詢</title>
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#1a1f1c; --muted:#5b6b63;
  --brand:#0b3d2e; --brand2:#147a5a; --accent:#e8b84a; --warn:#c0392b;
  --line:#e2e8e4; --chip:#eef5f1; --shadow:0 8px 24px rgba(11,61,46,.08);
  --radius:14px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.45}
body{min-height:100dvh}
.top{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,#0b3d2e 0%,#147a5a 100%);
  color:#fff;padding:14px 16px 12px;box-shadow:0 2px 12px rgba(0,0,0,.15)
}
.top h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.02em}
.top p{margin:4px 0 0;font-size:.78rem;opacity:.85}
.wrap{max-width:920px;margin:0 auto;padding:12px 12px calc(24px + var(--safe-b))}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow);margin-bottom:12px
}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.field-keyword{grid-column:1 / -1}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;font-weight:600}
input,select{
  width:100%;border:1px solid #cfdad4;border-radius:10px;padding:10px 12px;
  font-size:16px;background:#fff;color:var(--ink);outline:none;
  transition:border .15s,box-shadow .15s
}
input:focus,select:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(20,122,90,.15)}
select:disabled{background:#f0f3f1;color:#8a9690;cursor:not-allowed}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{
  border:0;border-radius:10px;padding:10px 14px;font-size:.92rem;font-weight:700;
  cursor:pointer;flex:1;min-width:110px
}
.btn-main{background:var(--brand);color:#fff}
.btn-main:active{transform:scale(.98)}
.btn-ghost{background:var(--chip);color:var(--brand)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 2px 10px;font-size:.82rem;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--chip);color:var(--brand);padding:3px 8px;border-radius:999px;font-weight:700;font-size:.75rem}
.list{display:flex;flex-direction:column;gap:10px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow);animation:in .18s ease-out
}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.card-h .title{font-weight:800;font-size:1rem}
.card-h .sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.tag-warn{background:#fdecea;color:var(--warn);font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag-ok{background:#e8f7ef;color:#147a5a;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:999px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.kv{grid-template-columns:repeat(4,1fr)}}
.kv .item{background:#f7faf8;border-radius:10px;padding:8px 10px}
.kv .k{font-size:.68rem;color:var(--muted);font-weight:700}
.kv .v{font-size:.95rem;font-weight:800;margin-top:2px;word-break:break-word}
.kv .item.wide{grid-column:1/-1}
.spsp{
  display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;
  background:var(--brand);color:#fff;border-radius:8px;padding:2px 8px;font-weight:900;letter-spacing:.03em
}
.note{margin-top:8px;font-size:.82rem;color:#444;background:#fffbeb;border:1px solid #f3e2a8;border-radius:10px;padding:8px 10px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:6px}
.foot{text-align:center;color:var(--muted);font-size:.72rem;margin:18px 0 8px}
.hl{background:rgba(232,184,74,.35);border-radius:3px;padding:0 1px}

/* --- password gate --- */
#authGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#06261c 0%,#0b3d2e 55%,#147a5a 100%);padding:20px}
#authGate.hidden{display:none}
.auth-box{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:22px 20px 18px;
  box-shadow:0 16px 40px rgba(0,0,0,.28)}
.auth-box h2{margin:0 0 6px;font-size:1.15rem;color:#0b3d2e}
.auth-box p{margin:0 0 14px;font-size:.82rem;color:#5b6b63}
.auth-box input{width:100%;border:1px solid #cfdad4;border-radius:10px;padding:12px 12px;font-size:16px;margin-bottom:10px}
.auth-box .err{color:#c0392b;font-size:.8rem;min-height:1.1em;margin:0 0 8px}
.auth-box button{width:100%;border:0;border-radius:10px;padding:12px;font-size:1rem;font-weight:800;background:#0b3d2e;color:#fff;cursor:pointer}
body.locked > :not(#authGate){visibility:hidden}

</style>
</head>
<body class="locked">

<div id="authGate" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="auth-box">
    <h2 id="authTitle">需要密碼</h2>
    <p>SPSP 雨刷查詢為內部工具，請輸入存取密碼。</p>
    <input id="authPass" type="password" autocomplete="current-password" placeholder="輸入密碼" enterkeyhint="go">
    <p class="err" id="authErr"></p>
    <button type="button" id="authBtn">解鎖</button>
  </div>
</div>

<header class="top">
  <h1>SPSP 雨刷尺寸／接頭查詢</h1>
  <p>現場速查 · 每次開啟載入最新資料 · <span id="rowCount">…</span> 筆車型</p>
</header>
<main class="wrap">
  <section class="panel">
    <div class="grid">
      <div>
        <label for="brand">品牌</label>
        <select id="brand"><option value="">全部品牌</option></select>
      </div>
      <div>
        <label for="model">車型</label>
        <select id="model" disabled><option value="">全部車型</option></select>
      </div>
      <div>
        <label for="year">年份</label>
        <select id="year" disabled><option value="">全部年份</option></select>
      </div>
      <div>
        <label for="connector">接頭</label>
        <select id="connector"><option value="">全部接頭</option></select>
      </div>
      <div class="field-keyword">
        <label for="keyword">搜尋關鍵字</label>
        <input id="keyword" type="search" placeholder="車身代號、接頭、備註…" autocomplete="off" enterkeyhint="search">
      </div>
    </div>
    <div class="actions">
      <button class="btn-main" id="btnSearch" type="button">查詢</button>
      <button class="btn-ghost" id="btnReset" type="button">清除</button>
    </div>
  </section>

  <div class="meta">
    <span id="countLabel">選擇品牌、接頭或輸入關鍵字</span>
    <span class="badge" id="liveBadge">即時篩選</span>
  </div>
  <div class="list" id="results"></div>
  <p class="foot">僅供參考 · 標示「需人工確認」請現場核對接頭／尺寸 · SPSP</p>
</main>

<script>
const AUTH_HASH = "4920425474509fee137faf135b0401a1ed49c4850cdf121733667ff527d59802";
const AUTH_KEY = "spsp_wiper_auth_v1";

async function sha256hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function unlockUI(){
  document.body.classList.remove("locked");
  const g = document.getElementById("authGate");
  if(g) g.classList.add("hidden");
}

async function tryUnlock(pw){
  const h = await sha256hex(pw);
  if(h !== AUTH_HASH) return false;
  try{ sessionStorage.setItem(AUTH_KEY, h); }catch(e){}
  unlockUI();
  return true;
}

async function ensureAuth(){
  try{
    const saved = sessionStorage.getItem(AUTH_KEY);
    if(saved === AUTH_HASH){ unlockUI(); return true; }
  }catch(e){}
  return new Promise(resolve => {
    const input = document.getElementById("authPass");
    const err = document.getElementById("authErr");
    const btn = document.getElementById("authBtn");
    async function submit(){
      err.textContent = "";
      const ok = await tryUnlock(input.value || "");
      if(ok){ resolve(true); return; }
      err.textContent = "密碼錯誤，請再試一次";
      input.select();
    }
    btn.addEventListener("click", submit);
    input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submit(); } });
    setTimeout(()=>input.focus(), 50);
  });
}

let DATA = [];

/** Normalize object or array rows → fixed 15-slot array */
function toRow(r){
  if(Array.isArray(r)) return r;
  return [
    r['品牌']||'', r['車型']||'', r['車身代號']||'',
    r['年份起']||'', r['年份迄']||'',
    r['左尺寸']||'', r['右尺寸']||'', r['後尺寸']||'',
    r['CARBUFF接頭']||'', r['PIAA接頭']||'', r['最終接頭']||'',
    r['SPSP接頭']||'', r['接頭中文說明']||'', r['需人工確認']||'', r['備註']||''
  ];
}

async function loadData(){
  const badge = document.getElementById('liveBadge');
  const rowCount = document.getElementById('rowCount');
  try{
    const url = './data.json?t=' + Date.now();
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const payload = await res.json();
    const raw = payload.rows || payload;
    DATA = (Array.isArray(raw) ? raw : []).map(toRow);
    if(rowCount) rowCount.textContent = String(DATA.length);
    if(badge){
      const ts = payload.updatedAt || '';
      badge.textContent = ts ? ('最新 '+ts) : '已載入最新';
    }
  }catch(err){
    console.error(err);
    if(badge) badge.textContent = '資料載入失敗';
    document.getElementById('results').innerHTML =
      `<div class="empty"><strong>無法載入 data.json</strong>請確認網站檔案完整，或稍後再試</div>`;
    throw err;
  }
}

const brandSel = document.getElementById('brand');
const modelSel = document.getElementById('model');
const yearSel  = document.getElementById('year');
const connectorSel = document.getElementById('connector');
const keywordIn = document.getElementById('keyword');
const results = document.getElementById('results');
const countLabel = document.getElementById('countLabel');

function chassisKey(r){ return String(r[2]||'').trim(); }
function yearKey(r){
  // Keep chassis in the option value so same-year variants remain distinct.
  return String(r[3]||'') + '\t' + String(r[4]||'') + '\t' + chassisKey(r);
}
function yearLabel(r){
  const a = r[3] || '?';
  const b = r[4] || '迄今';
  const range = a + ' – ' + b;
  const chassis = chassisKey(r);
  return chassis ? `${range}（${chassis}）` : range;
}
function connectorOf(r){ return String(r[11]||'').trim(); }
function compareZh(a,b){ return String(a).localeCompare(String(b),'zh-Hant'); }
function connectorSort(a,b){
  // A, B1, B2, B11, C … then non-code labels such as 待確認 / 不適用.
  const re = /^([A-Za-z]+)(\d*)$/;
  const ra = re.exec(a);
  const rb = re.exec(b);
  if(ra && rb){
    const c = ra[1].toUpperCase().localeCompare(rb[1].toUpperCase());
    if(c) return c;
    const na = ra[2] === '' ? -1 : parseInt(ra[2], 10);
    const nb = rb[2] === '' ? -1 : parseInt(rb[2], 10);
    return na - nb;
  }
  if(ra) return -1;
  if(rb) return 1;
  return compareZh(a,b);
}
function uniqueValues(list){
  const out = [];
  const seen = new Set();
  for(const v of list){
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
  }
  return out;
}
function setOptions(sel, placeholder, entries, current){
  sel.innerHTML = '';
  const blank = document.createElement('option');
  blank.value = '';
  blank.textContent = placeholder;
  sel.appendChild(blank);
  const values = new Set();
  for(const [value, label] of entries){
    if(!value || values.has(value)) continue;
    values.add(value);
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = label;
    sel.appendChild(opt);
  }
  sel.value = current && values.has(current) ? current : '';
}
function syncDropdowns(){
  // Each menu lists only values that still have rows under the other menus.
  // Keyword stays out of this so typing does not reshuffle the lists.
  let brand = brandSel.value;
  let model = modelSel.value;
  let year = yearSel.value;
  let connector = connectorSel.value;
  let brands = [];
  let models = [];
  let yearEntries = [];
  let connectors = [];

  for(let pass = 0; pass < 2; pass++){
    brands = uniqueValues(
      DATA.filter(r => !connector || connectorOf(r) === connector).map(r => r[0])
    ).sort(compareZh);
    if(brand && !brands.includes(brand)){
      brand = '';
      model = '';
      year = '';
    }
    if(!brand){
      model = '';
      year = '';
      models = [];
    }else{
      models = uniqueValues(
        DATA.filter(r => r[0] === brand && (!connector || connectorOf(r) === connector)).map(r => r[1])
      ).sort(compareZh);
      if(model && !models.includes(model)){
        model = '';
        year = '';
      }
    }
    if(!brand || !model){
      year = '';
      yearEntries = [];
    }else{
      const seen = new Map();
      for(const r of DATA){
        if(r[0] !== brand || r[1] !== model) continue;
        if(connector && connectorOf(r) !== connector) continue;
        const k = yearKey(r);
        if(!seen.has(k)) seen.set(k, yearLabel(r));
      }
      yearEntries = [...seen.entries()].sort((a,b)=>{
        return String(a[0].split('\t')[0]).localeCompare(String(b[0].split('\t')[0]),'zh-Hant',{numeric:true});
      });
      if(year && !seen.has(year)) year = '';
    }
    connectors = uniqueValues(DATA.filter(r => {
      if(brand && r[0] !== brand) return false;
      if(model && r[1] !== model) return false;
      if(year && yearKey(r) !== year) return false;
      return true;
    }).map(connectorOf)).sort(connectorSort);
    if(connector && !connectors.includes(connector)){
      connector = '';
      continue;
    }
    break;
  }

  setOptions(brandSel, '全部品牌', brands.map(b => [b, b]), brand);
  modelSel.disabled = !brand;
  setOptions(modelSel, '全部車型', models.map(m => [m, m]), model);
  yearSel.disabled = !(brand && model);
  setOptions(yearSel, '全部年份', yearEntries, year);
  setOptions(connectorSel, '全部接頭', connectors.map(c => [c, c]), connector);
}

// indices: 0品牌 1車型 2車身代號 3年份起 4年份迄 5左 6右 7後 8CARBUFF 9PIAA 10最終 11SPSP 12說明 13人工 14備註

function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'')}
function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hl(text, q){
  const t = esc(text);
  if(!q) return t || '—';
  const qq = esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  if(!qq) return t || '—';
  try{return (t||'—').replace(new RegExp(qq,'ig'),m=>`<span class="hl">${m}</span>`)}catch(e){return t||'—'}
}
function yearRange(r){
  const a = r[3] || '?'; const b = r[4] || '迄今';
  return a === '?' && b === '迄今' ? '—' : `${a} – ${b}`;
}
function rowHaystack(r){
  // Keyword search is intentionally independent of the dropdown filters.
  // Search every value so a keyword can find matches anywhere in the dataset,
  // including the manual-confirmation flag and any future columns.
  return norm(r.join(' '));
}
function card(r, qk){
  // Only pending statuses show the warning badge; confirmed rows stay visibly confirmed.
  const manual = String(r[13]||'').trim();
  const warn = manual === '待確認' || manual === '需人工確認';
  const confirmed = manual === '已人工確認';
  const note = [r[14], r[12] && !r[14] ? ('接頭說明：' + r[12]) : ''].filter(Boolean).join(' · ');
  return `<article class="card">
    <div class="card-h">
      <div>
        <div class="title">${hl(r[0],qk)} · ${hl(r[1],qk)}</div>
        <div class="sub">車身代號 ${hl(r[2],qk)}　｜　年份 ${esc(yearRange(r))}</div>
      </div>
      <div>${warn?'<span class="tag-warn">需人工確認</span>':confirmed?'<span class="tag-ok">已人工確認</span>':'<span class="tag-ok">資料可用</span>'}</div>
    </div>
    <div class="kv">
      <div class="item"><div class="k">左尺寸</div><div class="v">${esc(r[5]||'—')}</div></div>
      <div class="item"><div class="k">右尺寸</div><div class="v">${esc(r[6]||'—')}</div></div>
      <div class="item"><div class="k">後尺寸</div><div class="v">${esc(r[7]||'—')}</div></div>
      <div class="item"><div class="k">SPSP</div><div class="v"><span class="spsp">${esc(r[11]||'—')}</span></div></div>
      <div class="item wide"><div class="k">最終接頭</div><div class="v">${hl(r[10]||'—',qk)}</div></div>
      <div class="item"><div class="k">CARBUFF</div><div class="v">${hl(r[8]||'—',qk)}</div></div>
      <div class="item"><div class="k">PIAA</div><div class="v">${hl(r[9]||'—',qk)}</div></div>
    </div>
    ${note?`<div class="note">${hl(note,qk)}</div>`:''}
  </article>`;
}

function query(){
  const brand = brandSel.value;
  const model = modelSel.value;
  const year  = yearSel.value;
  const connector = connectorSel.value;
  const kw = norm(keywordIn.value);
  const hasDropdownFilters = Boolean(brand || model || year || connector);
  const hasKeyword = Boolean(kw);
  if(!hasDropdownFilters && !hasKeyword){
    results.innerHTML = `<div class="empty"><strong>請選擇條件或輸入關鍵字</strong>可依品牌 → 車型 → 年份 → 接頭層層篩選，或直接搜尋關鍵字</div>`;
    countLabel.textContent = '選擇品牌、接頭或輸入關鍵字';
    return;
  }
  const out = [];
  for(const r of DATA){
    // Each dropdown is optional; with no dropdown selected, keyword-only
    // searches scan every row instead of requiring a brand/model/year first.
    if(brand && r[0] !== brand) continue;
    if(model && r[1] !== model) continue;
    if(year && yearKey(r) !== year) continue;
    if(connector && connectorOf(r) !== connector) continue;
    if(hasKeyword && !rowHaystack(r).includes(kw)) continue;
    out.push(r);
  }
  out.sort((a,b)=>{
    return a[0].localeCompare(b[0],'zh-Hant')
      || a[1].localeCompare(b[1],'zh-Hant')
      || String(a[3]).localeCompare(String(b[3]),'zh-Hant',{numeric:true});
  });
  countLabel.textContent = `找到 ${out.length} 筆` + (out.length > 80 ? '（顯示前 80）' : '');
  if(!out.length){
    results.innerHTML = `<div class="empty"><strong>沒有符合的車型</strong>試試放寬條件，或改用關鍵字搜尋</div>`;
    return;
  }
  const qk = keywordIn.value.trim();
  results.innerHTML = out.slice(0,80).map(r => card(r, qk)).join('');
}

let t = null;
function schedule(){ clearTimeout(t); t = setTimeout(query, 120); }

brandSel.addEventListener('change', ()=>{ syncDropdowns(); query(); });
modelSel.addEventListener('change', ()=>{ syncDropdowns(); query(); });
yearSel.addEventListener('change', ()=>{ syncDropdowns(); query(); });
connectorSel.addEventListener('change', ()=>{ syncDropdowns(); query(); });
keywordIn.addEventListener('input', schedule);
keywordIn.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); query(); }});
document.getElementById('btnSearch').addEventListener('click', query);
document.getElementById('btnReset').addEventListener('click', ()=>{
  brandSel.value = '';
  modelSel.value = '';
  yearSel.value = '';
  connectorSel.value = '';
  keywordIn.value = '';
  syncDropdowns();
  results.innerHTML = '';
  countLabel.textContent = '選擇品牌、接頭或輸入關鍵字';
});

(async function(){
  await ensureAuth();
  try{
    await loadData();
    syncDropdowns();
  }catch(e){ /* shown above */ }
})();
</script>
</body>
</html>
