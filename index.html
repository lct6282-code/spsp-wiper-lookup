<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SPSP 雨刷查詢</title>
<style>
:root{color-scheme:dark;--bg:#1c1c1e;--card:#2c2c2e;--raised:#3a3a3c;--field:#161618;--photo-bg:#636366;--ink:#f2f2f7;--muted:#aeaeb2;--accent:#68dbac;--accent-ink:#082619;--line:#48484a;--warn:#ffce75;--warn-bg:#352b18;--danger:#ffaaa6;--danger-bg:#392420;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit}
button,a,input,select,summary{-webkit-tap-highlight-color:transparent}
button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink);padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
button:hover{border-color:var(--accent)}
button:active{background:#48484a}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--accent);overflow-wrap:anywhere}
input,select,textarea{width:100%;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);padding:10px 12px;font-size:16px}
input::placeholder,textarea::placeholder{color:#98989d}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select:disabled{color:var(--muted);opacity:.65}
input[type="search"]::-webkit-search-cancel-button{cursor:pointer}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:14px max(14px,env(safe-area-inset-left)) 0}
.top-inner,.wrap{max-width:980px;margin:auto}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-mark{font-size:20px;font-weight:800;letter-spacing:-1px;color:var(--accent);line-height:1.2;border-right:1px solid var(--line);padding-right:12px}
h1{font-size:17px;margin:0;font-weight:700}
.version{font-size:12px;color:var(--muted);margin:3px 0 0}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:12px}
.nav button{border:0;border-radius:8px 8px 0 0;min-height:46px;background:transparent;color:var(--muted);padding:9px 4px;font-weight:600;position:relative}
.nav button[aria-selected="true"]{color:var(--accent);background:var(--card)}
.nav button[aria-selected="true"]:after{content:"";position:absolute;bottom:0;left:22%;right:22%;height:3px;background:var(--accent);border-radius:3px 3px 0 0}
.nav-count{font-size:11px;margin-left:3px;padding:1px 5px;border-radius:20px;background:var(--raised);color:var(--ink)}
.wrap{padding:16px 12px calc(30px + var(--safe-b))}
.panel{padding:16px;border:1px solid var(--line);background:var(--card);border-radius:15px;margin-bottom:14px}
.field label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:6px}
.search-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.search-label label{font-size:15px;font-weight:700;color:var(--ink);margin:0}
.subtle{color:var(--muted);font-size:12px}
.search-field{margin-bottom:14px}
.search-field input{padding:12px 14px;min-height:50px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn-main:active{background:#a3f1ca}
.btn-quiet{background:transparent;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn-main{flex:1}
.advanced{border-top:1px solid var(--line);margin-top:14px}
.advanced summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;cursor:pointer;list-style:none}
.advanced summary::-webkit-details-marker,.detail summary::-webkit-details-marker{display:none}
.advanced summary:after,.detail summary:after{content:"＋";font-size:17px}
.advanced[open] summary:after,.detail[open] summary:after{content:"－"}
.advanced .filters{padding-top:4px;padding-bottom:4px}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.filter-chip{font-size:12px;min-height:44px;padding:7px 10px;color:var(--accent);background:var(--raised)}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:0 3px;margin:16px 0 10px}
.meta strong{font-size:14px}
.meta select{width:auto;max-width:160px;font-size:13px;min-height:44px;padding:8px 10px}
.list{display:grid;gap:12px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.card-main{padding:15px}
.card-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card-title{margin:0;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.card-brand{font-size:12px;color:var(--muted);margin-bottom:3px}
.card-sub{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.favorite{flex-shrink:0;width:44px;padding:0;color:var(--muted);font-size:23px;background:transparent}
.favorite[aria-pressed="true"]{color:#ffce75;background:var(--warn-bg);border-color:#695932}
.status{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;margin-top:10px;background:var(--raised);color:#d1d1d6;max-width:100%;overflow-wrap:anywhere}
.status.confirmed{background:#163e2b;color:#91ecc0}
.status.pending{background:var(--warn-bg);color:var(--warn)}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.size{padding:9px 10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;min-width:0}
.size .k{display:block;font-size:12px;color:var(--muted)}
.size .v{display:block;font-size:23px;font-weight:700;margin-top:3px;line-height:1.25;overflow-wrap:anywhere}
.size .v.missing{font-size:14px;line-height:1.65;color:var(--muted)}
.size .unit{font-size:13px;margin-left:2px;color:var(--muted);font-weight:400}
.connector-line{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:13px;min-width:0}
.connector-info{min-width:0;flex:1}
.connector-info .k{font-size:12px;color:var(--muted);display:block}
.connector-code{font-size:21px;display:block;font-weight:800;color:var(--accent);overflow-wrap:anywhere}
.connector-code.unfit{font-size:17px;color:var(--danger)}
.conn-zoom{background:var(--photo-bg);isolation:isolate;padding:3px;border-color:#747478;line-height:0;flex:0 0 auto;max-width:48%;border-radius:9px;min-height:54px}
.conn-thumb{display:block;width:140px;max-width:100%;height:auto;color:var(--ink);font-size:12px;mix-blend-mode:multiply;filter:brightness(1.15)}
.connector-caption{font-size:12px;color:var(--muted);margin-top:4px}
.important-note{margin-top:12px;font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:9px 11px;overflow-wrap:anywhere}
.detail{border-top:1px solid var(--line)}
.detail summary{padding:0 15px;min-height:46px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
.detail-content{padding:0 15px 15px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-item{padding:9px 10px;background:var(--bg);border-radius:8px;min-width:0}
.detail-item.wide{grid-column:1/-1}
.detail-item .k{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.detail-item .v{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.detail-item ul{padding-left:18px;margin:5px 0;font-size:13px}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.card-actions button{padding:9px 5px;font-size:13px}
.empty{padding:32px 18px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:14px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty p{font-size:14px;line-height:1.7;margin:0}
.empty button{margin-top:16px}
.load-more{width:100%;margin-top:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;line-height:1.8;margin:22px 0 0}
.saved-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.saved-head h2,.atlas-head h2{font-size:17px;margin:0}
.saved-head p,.atlas-head p{font-size:13px;color:var(--muted);margin:4px 0 0}
.atlas-head{margin-bottom:16px}
.atlas-pickers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.atlas-comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.atlas-card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;min-width:0}
.atlas-card h3{font-size:20px;color:var(--accent);margin:0 0 8px}
.atlas-card .conn-zoom{display:block;width:100%;max-width:100%;margin-bottom:10px}
.atlas-card .conn-thumb{width:100%}
.atlas-card p{font-size:13px;color:var(--muted);margin:8px 0;overflow-wrap:anywhere}
.atlas-card .gallery-detail{font-size:12px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.atlas-card .btn-use{width:100%;margin-top:8px;padding:8px 5px;font-size:13px}
.atlas-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.atlas-tile{padding:9px 6px;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px}
.atlas-tile .tile-count{font-size:11px;color:var(--muted)}
.atlas-grid-label{font-size:13px;color:var(--muted);margin:20px 0 -6px}
.hl{color:var(--ink);background:#4a462b;border-radius:3px}
.toast{position:fixed;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:100;background:var(--raised);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 28px #0007;border-radius:12px;padding:11px 16px;max-width:calc(100% - 30px);width:max-content;font-size:14px;text-align:center;pointer-events:none}
dialog{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:16px;border-radius:15px;width:min(500px,calc(100% - 28px));max-height:calc(100dvh - 48px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.83)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.dialog-head h2{font-size:17px;margin:0}
.dialog-head button{min-width:60px}
.image-matte{background:var(--photo-bg);isolation:isolate;border-radius:9px;overflow:hidden}
.dialog-image{display:block;width:100%;height:auto;mix-blend-mode:multiply;filter:brightness(1.15)}
.dialog-desc{font-size:14px;line-height:1.8;color:var(--muted);margin:12px 0 0}
.manual-copy{min-height:180px;resize:vertical;font-size:14px}
#authGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
#authGate.hidden{display:none}
.auth-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
.auth-box .auth-brand{color:var(--accent);font-size:24px;font-weight:800;letter-spacing:-1px;margin-bottom:14px}
.auth-box h2{font-size:19px;margin:0 0 8px}
.auth-box p{font-size:14px;color:var(--muted);margin:0 0 18px}
.auth-box .err{color:var(--danger);min-height:21px;margin:8px 0;font-size:13px}
.auth-box button{width:100%;font-size:16px}
body.locked>:not(#authGate){visibility:hidden}
@media(min-width:700px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}.advanced .filters{grid-template-columns:1fr 1fr}.list{grid-template-columns:1fr 1fr;align-items:start}.nav{max-width:560px}.top{padding-top:18px}.wrap{padding-top:22px}.atlas-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.atlas-card{padding:18px}.atlas-card .conn-zoom{max-width:320px}.atlas-card p{font-size:14px}}
@media(max-width:359px){.panel,.card-main{padding:12px}.sizes{gap:6px}.size{padding:8px}.size .v{font-size:21px}.size .v.missing{font-size:13px}.atlas-comparison{gap:8px}.atlas-card{padding:9px}.search-label .subtle{display:none}.card-title{font-size:16px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body class="locked">
<div id="authGate" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="auth-box">
    <div class="auth-brand">SPSP</div>
    <h2 id="authTitle">雨刷尺寸／接頭查詢</h2>
    <p>內部查詢工具，請輸入存取密碼。</p>
    <label for="authPass" class="subtle">存取密碼</label>
    <input type="password" id="authPass" placeholder="輸入密碼" autocomplete="current-password" enterkeyhint="go">
    <p class="err" id="authErr" role="alert"></p>
    <button type="button" id="authBtn" class="btn-main">解鎖</button>
  </div>
</div>
<header class="top">
  <div class="top-inner">
    <div class="brand-row"><div class="brand-mark">SPSP</div><div><h1>雨刷尺寸／接頭查詢</h1><p class="version" id="dataMeta">載入資料中</p></div></div>
    <nav class="nav" aria-label="查詢功能" role="tablist">
      <button id="tab-search" role="tab" aria-controls="searchView" aria-selected="true" data-view="search">查詢</button>
      <button id="tab-favorites" role="tab" aria-controls="favoritesView" aria-selected="false" data-view="favorites">收藏<span class="nav-count" id="favoriteCount">0</span></button>
      <button id="tab-recent" role="tab" aria-controls="recentView" aria-selected="false" data-view="recent">最近</button>
      <button id="tab-atlas" role="tab" aria-controls="atlasView" aria-selected="false" data-view="atlas">接頭圖鑑</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section id="searchView" role="tabpanel" aria-labelledby="tab-search">
    <form id="searchForm" class="panel">
      <div class="field search-field">
        <div class="search-label"><label for="keyword">快速找車型</label><span class="subtle">可組合車名與年份</span></div>
        <input id="keyword" type="search" placeholder="例如：Toyota Camry 2018" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="filters">
        <div class="field"><label for="brand">品牌</label><select id="brand"><option value="">全部品牌</option></select></div>
        <div class="field"><label for="model">車型</label><select id="model" disabled><option value="">請先選品牌</option></select></div>
        <div class="field"><label for="exactYear">年份（西元）</label><input id="exactYear" type="number" min="1900" max="2100" step="1" inputmode="numeric" placeholder="例如 2018"></div>
        <div class="field"><label for="connector">SPSP 接頭</label><select id="connector"><option value="">全部接頭</option></select></div>
      </div>
      <details class="advanced"><summary>更多篩選</summary><div class="filters">
        <div class="field"><label for="year">年式／車身代號</label><select id="year" disabled><option value="">請先選車型</option></select></div>
        <div class="field"><label for="statusFilter">資料狀態</label><select id="statusFilter"><option value="">全部狀態</option><option value="confirmed">已人工確認</option><option value="unreviewed">尚未核對</option><option value="pending">需人工確認</option><option value="unfit">SPSP 不適用</option></select></div>
      </div></details>
      <div class="actions"><button class="btn-main" type="submit">查詢車型</button><button class="btn-quiet" id="btnReset" type="button">清除條件</button></div>
      <div id="activeFilters" class="active-filters" aria-label="已選條件" hidden></div>
    </form>
    <div class="meta"><strong id="countLabel" role="status" aria-live="polite">選擇條件或輸入車名</strong><select id="sort" aria-label="結果排序"><option value="brand">品牌／車型</option><option value="newest">年式新到舊</option><option value="oldest">年式舊到新</option></select></div>
    <div id="results" class="list"></div>
    <button id="loadMore" class="load-more" type="button" hidden>載入更多車型</button>
  </section>
  <section id="favoritesView" role="tabpanel" aria-labelledby="tab-favorites" hidden><div class="saved-head"><div><h2>收藏車型</h2><p>儲存在目前這支手機或瀏覽器</p></div></div><div id="favoritesList" class="list"></div></section>
  <section id="recentView" role="tabpanel" aria-labelledby="tab-recent" hidden><div class="saved-head"><div><h2>最近查看</h2><p>開啟詳細資料後，會記住最近 12 筆車型</p></div></div><div id="recentList" class="list"></div></section>
  <section id="atlasView" role="tabpanel" aria-labelledby="tab-atlas" hidden>
    <div class="atlas-head"><h2>接頭圖鑑與比較</h2><p>兩款並排核對，點圖片可放大。</p></div>
    <div class="atlas-pickers"><div class="field"><label for="compareA">接頭一</label><select id="compareA"></select></div><div class="field"><label for="compareB">接頭二</label><select id="compareB"></select></div></div>
    <div id="atlasComparison" class="atlas-comparison"></div><p class="atlas-grid-label">選擇接頭（數字為對應車型筆數）</p><div id="atlasGrid" class="atlas-grid"></div>
  </section>
  <p class="foot">尺寸以資料庫標示為準 · 尺寸未建檔時請先確認<br>年份交界請核對車身代號／生產月份，安裝前請確認實車接頭。</p>
</main>
<dialog id="imageDialog" aria-labelledby="imageTitle"><div class="dialog-head"><h2 id="imageTitle">SPSP 接頭</h2><button type="button" data-close="imageDialog">關閉</button></div><div class="image-matte"><img id="imageLarge" class="dialog-image" alt=""></div><p id="imageDescription" class="dialog-desc"></p></dialog>
<dialog id="copyDialog" aria-labelledby="copyTitle"><div class="dialog-head"><h2 id="copyTitle">複製規格</h2><button type="button" data-close="copyDialog">關閉</button></div><textarea id="manualCopy" class="manual-copy" readonly aria-label="可複製內容"></textarea><p class="dialog-desc">長按文字即可選取並複製。</p></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
const AUTH_HASH = "4920425474509fee137faf135b0401a1ed49c4850cdf121733667ff527d59802";
const AUTH_KEY = "spsp_wiper_auth_v1";

async function sha256hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function unlockUI(){
  document.body.classList.remove("locked");
  const g = document.getElementById("authGate");
  if(g) g.classList.add("hidden");
}

async function tryUnlock(pw){
  const h = await sha256hex(pw);
  if(h !== AUTH_HASH) return false;
  try{ sessionStorage.setItem(AUTH_KEY, h); }catch(e){}
  unlockUI();
  return true;
}

async function ensureAuth(){
  try{
    const saved = sessionStorage.getItem(AUTH_KEY);
    if(saved === AUTH_HASH){ unlockUI(); return true; }
  }catch(e){}
  return new Promise(resolve => {
    const input = document.getElementById("authPass");
    const err = document.getElementById("authErr");
    const btn = document.getElementById("authBtn");
    async function submit(){
      err.textContent = "";
      const ok = await tryUnlock(input.value || "");
      if(ok){ resolve(true); return; }
      err.textContent = "密碼錯誤，請再試一次";
      input.select();
    }
    btn.addEventListener("click", submit);
    input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submit(); } });
    setTimeout(()=>input.focus(), 50);
  });
}

const PAGE_SIZE = 30;
const CONNECTOR_CODES = ['A','B1','B2','B3','B4','B5','B6','B7','B8','B9','B10','B11','B13','C','D','E','F','G'];
const STORAGE_KEY = 'spsp.lookup.preferences.v2';
const $ = id => document.getElementById(id);
const state = { rows:[], matches:[], visible:PAGE_SIZE, view:'search', favorites:[], recent:[], updatedAt:'', loaded:false };
const BRAND_ALIASES = [
  ['VW','Volkswagen 大眾'],['Mercedes','Mercedes-Benz MercedesBenz 奔馳'],['BMW','寶馬 寶馬汽車'],
  ['Skoda','Škoda 斯柯達'],['Subaru','斯巴魯'],['Peugeot','標緻'],['Masarati','Maserati'],
  ['Land Rover','LandRover 路虎'],['Ssangyong','雙龍 KGM'],['Alfa Romeo','AlfaRomeo 愛快'],
  ['Toyota','TOYOTA'],['Honda','HONDA'],['Hyundai','HYUNDAI']
];
const MODEL_ALIASES = [
  [/Honda/i,/Civic/i,'喜美'],[/Honda/i,/Accord/i,'雅哥'],[/Mazda/i,/^(?:3|Mazda\s*3)(?:\b|\s|\()/i,'馬三 馬3 Mazda3'],
  [/Mazda/i,/^(?:6|Mazda\s*6)(?:\b|\s|\()/i,'馬六 馬6 Mazda6'],[/Toyota/i,/Corolla.*Altis|Altis/i,'CorollaAltis 阿提斯'],

function openImage(code){
  const src=connectorImage(code);if(!src)return;
  $('imageTitle').textContent='SPSP 接頭 '+code;$('imageLarge').src=src;$('imageLarge').alt='SPSP 接頭 '+code+' 型錄圖片';
  $('imageDescription').textContent=connectorDescription(code)||'目前僅提供型錄圖片，安裝前請依實車核對接頭形狀與卡榫。';
  $('imageDialog').showModal();
}
function resetFilters(){for(const id of ['brand','model','year','exactYear','connector','statusFilter','keyword'])$(id).value='';syncDropdowns();query();}
function openSharedVehicle(){
  const key=decodeKey(new URL(location.href).searchParams.get('vehicle'));
  if(!key)return;
  const row=state.rows.find(row=>row.key===key);
  if(!row){toast('分享的車型資料已變更，請重新查詢。');return;}
  resetFilters();$('brand').value=row.v[0];syncDropdowns();$('model').value=row.v[1];syncDropdowns();$('year').value=yearKey(row);query();remember(row);
}
async function loadData(){
  $('dataMeta').textContent='載入最新資料中';
  try{
    const response=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);
    const payload=await response.json(),entries=Array.isArray(payload)?payload:payload.rows;
    if(!Array.isArray(entries))throw new Error('Invalid database format');
    state.rows=prepareRows(entries);state.updatedAt=text(payload.updatedAt);state.loaded=true;
    $('dataMeta').textContent=`${state.rows.length} 筆車型${state.updatedAt?' · 更新 '+state.updatedAt:''}`;
    readPreferences();syncDropdowns();query();renderSaved();openSharedVehicle();
  }catch(error){state.loaded=false;$('dataMeta').textContent='資料載入失敗';$('results').innerHTML=`<div class="empty"><strong>暫時無法載入資料</strong><p>請確認網路連線，再試一次。</p><button type="button" data-retry>重新載入</button></div>`;console.error('SPSP database loading failed:',error);}
}
let searchTimer;
$('searchForm').addEventListener('submit',event=>{event.preventDefault();clearTimeout(searchTimer);query();if(state.matches.length===1)remember(state.matches[0]);$('keyword').blur();$('exactYear').blur();});
for(const id of ['brand','model','year','connector'])$(id).addEventListener('change',()=>{syncDropdowns();query();});
$('statusFilter').addEventListener('change',()=>query());$('sort').addEventListener('change',()=>query());
for(const id of ['keyword','exactYear'])$(id).addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>query(),160);});
$('btnReset').addEventListener('click',resetFilters);
$('loadMore').addEventListener('click',()=>{state.visible+=PAGE_SIZE;renderMatches();});
for(const id of ['compareA','compareB'])$(id).addEventListener('change',renderAtlas);
document.querySelector('.nav').addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(button)setView(button.dataset.view);});
document.querySelector('.nav').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;const views=['search','favorites','recent','atlas'];let index=views.indexOf(state.view);index=event.key==='Home'?0:event.key==='End'?3:(index+(event.key==='ArrowRight'?1:3))%4;event.preventDefault();setView(views[index]);$('tab-'+views[index]).focus();});
document.addEventListener('click',async event=>{
  const retry=event.target.closest('[data-retry]');if(retry){await loadData();return;}
  const close=event.target.closest('[data-close]');if(close){$(close.dataset.close).close();return;}
  const zoom=event.target.closest('[data-zoom]');if(zoom){openImage(zoom.dataset.zoom);return;}
  const clear=event.target.closest('[data-clear]');if(clear){const key=clear.dataset.clear;$(key==='status'?'statusFilter':key).value='';syncDropdowns();query();return;}
  const use=event.target.closest('[data-use-connector]');if(use){resetFilters();$('connector').value=use.dataset.useConnector;syncDropdowns();query();setView('search');$('connector').focus();return;}
  const compare=event.target.closest('[data-compare]');if(compare){$('compareA').value=compare.dataset.compare;renderAtlas();return;}
  const action=event.target.closest('[data-action]');if(!action)return;
  const id=Number(action.dataset.id),row=state.rows[id];if(!row)return;
  if(action.dataset.action==='favorite')toggleFavorite(row,id);
  if(action.dataset.action==='copy'){remember(row);await copyText(specification(row));}
  if(action.dataset.action==='share'){remember(row);await shareRow(row);}
});
document.addEventListener('toggle',event=>{if(event.target.matches('details.detail')&&event.target.open){const row=state.rows[Number(event.target.dataset.id)];if(row)remember(row);}},true);
document.addEventListener('error',event=>{const img=event.target;if(img instanceof HTMLImageElement&&img.classList.contains('conn-thumb')){const button=img.closest('.conn-zoom');if(button)button.replaceWith(Object.assign(document.createElement('span'),{className:'subtle',textContent:'圖片暫時無法載入'}));}},true);
for(const id of ['imageDialog','copyDialog'])$(id).addEventListener('click',event=>{if(event.target===$(id)){const rect=$(id).getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)$(id).close();}});
(async()=>{await ensureAuth();await loadData();})();
</script>
</body>
</html>
